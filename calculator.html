<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
  body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f0f0; font-family:Arial; }
  .calc { background:#333; padding:20px; border-radius:12px; width:300px; }
  #display { width:100%; height:60px; font-size:28px; text-align:right; padding:10px; box-sizing:border-box; border:none; border-radius:8px; margin-bottom:12px; }
  .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { padding:18px; font-size:20px; border:none; border-radius:8px; cursor:pointer; background:#555; color:white; }
  button:hover { background:#777; }
  .op { background:#ff9500; }
  .op:hover { background:#ffad33; }
  .eq { background:#28a745; grid-column: span 2; }
  .eq:hover { background:#34c759; }
</style>
</head>
<body>
<div class="calc">
  <input type="text" id="display" readonly>
  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">⌫</button>
    <button class="op" onclick="append('/')">÷</button>
    <button class="op" onclick="append('*')">×</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="op" onclick="append('-')">−</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="op" onclick="append('+')">+</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="op" onclick="append('.')">.</button>

    <button onclick="append('0')">0</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  function append(val) { display.value += val; }
  function clearDisplay() { display.value = ''; }
  function deleteLast() { display.value = display.value.slice(0, -1); }
  function calculate() {
    try { display.value = eval(display.value); }
    catch { display.value = 'Error'; }
  }
</script>
</body>
</html>
